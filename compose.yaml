services:
  control:
    image: ${AGENTGATE_IMAGE:?Set the CI-built image reference with its sha256 digest}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: '10001:10001'
    pids_limit: 128
    mem_limit: 512m
    cpus: 2
    volumes:
      - state:/var/lib/agentgate
      - trust:/var/lib/agentgate-trust
      - backups:/var/backups/agentgate
      - ./settings.json:/bootstrap/settings.json:ro
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8930/healthz]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [control]
  tls:
    image: caddy@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    ports: ['127.0.0.1:9443:9443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls-data:/data
      - tls-config:/config
    depends_on:
      control: {condition: service_healthy}
    networks: [control]
networks:
  # A fixed subnet, so settings.json can name exactly the TLS front as the
  # one trusted proxy (trusted_proxies): the service then limits and samples
  # requests by the client address Caddy forwards, not by Caddy's own.
  # Change both together if this range is taken on the machine.
  control:
    ipam:
      config:
        - subnet: 10.231.207.0/28
volumes:
  state: {}
  trust: {}
  backups: {}
  tls-data: {}
  tls-config: {}
