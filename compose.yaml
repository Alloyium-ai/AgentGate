services:
  control:
    image: ${AGENTGATE_IMAGE:?Set the CI-built image reference with its sha256 digest}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: '10001:10001'
    pids_limit: 128
    mem_limit: 512m
    cpus: 2
    volumes:
      - state:/var/lib/agentgate
      - trust:/var/lib/agentgate-trust
      - backups:/var/backups/agentgate
      - ./settings.json:/bootstrap/settings.json:ro
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8930/healthz]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [control]
  tls:
    image: caddy@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    ports: ['127.0.0.1:9443:9443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls-data:/data
      - tls-config:/config
    depends_on:
      control: {condition: service_healthy}
    networks:
      control:
        # The one address settings.json trusts (trusted_proxies).
        ipv4_address: 10.231.207.2
networks:
  # An ordinary Docker bridge, not an internal network: any process on this
  # machine can connect to the control service on it directly, and such a
  # connection arrives from the bridge gateway 10.231.207.1. settings.json
  # therefore trusts exactly the TLS front's fixed address, 10.231.207.2/32:
  # the service limits and samples requests by the client address Caddy
  # forwards, and a direct local connection is keyed by the gateway and
  # cannot choose its own client address in X-Forwarded-For. Other
  # containers (the control service) get addresses from 10.231.207.8/29
  # only, so none can take the fixed one. Change the subnet, the range, the
  # address and settings.json together if this range is taken on the machine.
  control:
    ipam:
      config:
        - subnet: 10.231.207.0/28
          ip_range: 10.231.207.8/29
          gateway: 10.231.207.1
volumes:
  state: {}
  trust: {}
  backups: {}
  tls-data: {}
  tls-config: {}
